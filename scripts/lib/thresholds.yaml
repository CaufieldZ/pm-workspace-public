# 工作区数字阈值权威来源。
# Python 调用：from lib.thresholds import T; T['checker']['max_lines']
#
# 分组（按执行机制 —— 改值后谁需要跟上）：
#   A. Python 运行时读 — 改 yaml = 立即生效
#   B. bash hook 运行时读 — awk 解析 · 改 yaml = 立即生效（hook 内同值快路径须手工同步）
#   C. bash hook 硬编码 — yaml 是登记册 · 改值须同步 hook
#   D. 文档纪律 — yaml 是登记册 · 执行方是文档规则文字 · 改值须同步文档
#   E. Python 硬编码 — yaml 是登记册 · 改值须同步 .py 常量
#
# 不在此 yaml：主观代码质量软建议（如「单函数 ≤ 80 行」）—— 归 html-pipeline.md 文档化。
# 也不在此 yaml：规则层逐文件体积上限（19 个文件各一个数，是名册不是标量）——
#   见 scripts/rule-budgets.manifest.json，消费者 scripts/check_rule_volume.py。

# ═══════════════════════════════════════════════════════════════
# A. Python 运行时读（改 yaml = 立即生效）
# ═══════════════════════════════════════════════════════════════

checker:
  # check_*.py 单文件扫描上限。> 此值跳过并打 WARN（不静默）。
  # 用途：跳过考古语料（inputs/docs/dig-*.md 可达 2 万行）；产出物超限属结构失控，WARN 提示人工看
  # 由 scripts/check_plain_language.py / scripts/check_cjk_punct.py 通过 thresholds.py 读取
  max_lines: 5000

voice_check:
  # HTML 产出物行数下限。< 此值报 FAIL。
  # 消费者：scripts/lib/run_voice_checks.py（运行时读取）
  # 理由：500 行是完整 HTML 产出物的经验下限，低于此通常意味着内容缺失 / 生成中断
  html_min_lines: 500

bullet_density:
  # check_bullet_density.py：单行 bullet/段落 挤话判定（hook block · diff-based 只拦新增行）
  # period_limit：bullet 行中文句号 ≥ 此值即命中（3 是分水岭——2 误伤合理子项串、4 漏 3 句挤话段）。
  #   只管 bullet：段落不再数句号（同尺子量两者会把「三句完整短句」的正常散文拦下，
  #   反而教人用逗号焊成一句绕检测），段落改由下面的碎句 / 长句两条判。
  # semicolon_limit：单行分号（；/ ;）≥ 此值即命中。正文分号串该拆嵌套 bullet
  #   （父 bullet 冒号领起 + 子 bullet），不是合法豁免。表格 cell 内 ; 是 md_to_confluence
  #   切 <li> 的约定分隔符，表格行豁免。
  # long_sentence_chars：单句 ≥ 此值即命中（bullet + 段落都查）。决策 / 变更 / 埋点章免这一条
  #   ——「方案。理由。阻塞。」论证叙事一句本就长，硬砍割裂推理。
  # fragment_min_sentences + fragment_median_chars：段落句数 ≥ 前者且句长中位数 < 后者 = 碎句
  #   （三句以上且句子普遍很短），该连成完整的话或改成列表。
  #   diff-based 只拦本次新增/修改行，存量不卡（存量 living 文档渐进消化）。
  # 消费者：scripts/check_bullet_density.py（运行时读取）
  period_limit: 3
  semicolon_limit: 2
  long_sentence_chars: 100
  fragment_min_sentences: 3
  fragment_median_chars: 9

# ═══════════════════════════════════════════════════════════════
# B. bash hook 运行时读（awk 解析 yaml · 改 yaml = 立即生效）
# ═══════════════════════════════════════════════════════════════

read_gate:
  # 全量 Read 拦截门槛：> 此行数的文件禁一次性全读，走 wc -l + Grep 定位 + offset/limit。
  # 消费者：.claude/hooks/pre-read-bigfile.sh（awk 运行时读；≤500 快路径硬编码同值，改值两处同步）
  # 同值规则：CLAUDE.md 工具调用红线「> 500 行先 wc -l」
  large_file_lines: 500

learned:
  # LEARNED.md 条目数超过此值 → session-start 注入行升级为「该整理」提醒。
  # 消费者：.claude/hooks/session-start.sh（awk 运行时读）
  # 标定：2026-08-04 → 09-11 攒 156 条（约 5 周），60 条约合两周一个整理周期
  consolidate_threshold: 60

# ═══════════════════════════════════════════════════════════════
# C. bash hook 硬编码（yaml 是登记册 · 改值须同步 hook）
# ═══════════════════════════════════════════════════════════════

write_tool:
  # HTML > 此行数禁 Write 工具直写、必须脚本生成
  # 消费者：.claude/hooks/lib/pre-writeedit-guards.sh pg_scripts_first（硬编码 200 = 本值）
  # 理由：Write 直写大 HTML 易丢内容 / 难重现；脚本生成可复跑
  html_max_lines: 200

# ═══════════════════════════════════════════════════════════════
# D. 文档纪律（yaml 是登记册 · 执行方是文档规则文字 · 改值须同步文档）
# ═══════════════════════════════════════════════════════════════

html_split:
  # HTML 超此行数拆三层架构（host + 内容函数 + 数据）
  # 理由：1500 行单文件维护痛苦，但小于此值拆反而过度工程
  # 同步：.claude/skills/_shared/rules/html-pipeline.md / html-build-split.md
  file_lines: 1500
  # Tab 数 ≥ 此值另触发拆分（无论行数）
  # 理由：10 Tab 单文件渲染卡顿明显，UI 维护复杂度跳跃式上升
  tab_count: 10

read_discipline:
  # baseline / PRD md 全读上限。> 此行数走 read_prd_section.py（--toc / -s / --grep）
  # 执行方：CLAUDE.md 启动规则（纪律层；hook 硬拦线是 read_gate.large_file_lines）
  # 理由：① baseline 章节结构清晰，按需读 > 全读 ② 全读 cache miss ~30K token、噪音多
  baseline_md_full_read: 300
  # HTML 产出物 > 此行数只 Grep 不 Read
  # 执行方：CLAUDE.md 工具调用红线
  html_grep_only: 1000

# ═══════════════════════════════════════════════════════════════
# E. Python 硬编码（yaml 是登记册 · 改值须同步 .py 常量）
# ═══════════════════════════════════════════════════════════════

prd_checks:
  # 长句 run-on 判定字数（WARN）。
  # 消费者：.claude/skills/prd/scripts/humanize/patterns.py LONG_SENTENCE_THRESHOLD
  long_sentence_chars: 100
  # 场景级业务故事字数上限（超限 raise）。
  # 消费者：.claude/skills/prd/scripts/core/md_renderer.py STORY_MAX_CHARS
  story_chars: 30
  # 场景数模式判定阈值（≥ 此值走 split 分文件）。
  # 消费者：.claude/skills/prd/scripts/gen_prd_skeleton.py _SCENE_COUNT_THRESHOLD
  scene_split_count: 10

baseline:
  # 模块章内容新鲜度过期天数（提醒不卡）。
  # 消费者：scripts/check_baseline_fresh.py --stale-days 默认值
  stale_days: 60
